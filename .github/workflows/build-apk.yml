name: Build APK

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK packages
        # Runner already ships the SDK (ANDROID_HOME set); just accept
        # licenses and ensure the exact platform + build-tools we compile
        # against exist. (android-actions/setup-android@v3 was removed: it
        # runs `sdkmanager tools`, a package that no longer exists, and runs
        # on deprecated Node 20.)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Notify-debug-apk-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/Notify.apk

      - name: Publish APK to Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/poss')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-build-${{ github.run_number }}
          name: ${{ github.ref_name }} build ${{ github.run_number }}
          body: Automated debug APK for ${{ github.ref_name }} commit ${{ github.sha }}.
          files: app/build/outputs/apk/debug/Notify.apk
